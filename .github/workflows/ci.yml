name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  # ── Stage 1: TypeScript checks (parallel) ──────────────────────
  typecheck-backend:
    name: TypeCheck Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: TypeScript check
        run: bunx tsc --noEmit

  typecheck-frontend:
    name: TypeCheck Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd frontend && bun install --frozen-lockfile
      - name: TypeScript check
        run: cd frontend && bunx tsc -b

  # ── Stage 2: Docker build (validates full build pipeline) ──────
  build:
    name: Docker Build
    needs: [typecheck-backend, typecheck-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t a11y-api .
      - name: Build Worker image
        run: docker build -f Dockerfile.worker -t a11y-worker .
