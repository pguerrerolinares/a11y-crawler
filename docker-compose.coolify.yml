# docker-compose.coolify.yml — Coolify deployment (v3 architecture)
# 3 services: API server, Worker, Browserless (Chromium pool)
# Routing/SSL is managed by Coolify: set the api domain in the Coolify UI.
# The SERVICE_FQDN_API_3000 magic var tells Coolify to expose api on port 3000.
# Reuses a shared PostgreSQL instance via the coolify network.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - coolify
    environment:
      # Coolify generates the Traefik routing for this service on port 3000,
      # using the domain you assign in the Coolify UI. No manual labels needed.
      - SERVICE_FQDN_API_3000
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - PORT=3000
      - REPORTS_DIR=/app/reports
    volumes:
      - reports:/app/reports
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.moonshot.ai/v1}
      - BROWSERLESS_URL=ws://browserless:3000/chromium/playwright
      - REPORTS_DIR=/app/reports
      - NODE_ENV=production
    volumes:
      - reports:/app/reports
    depends_on:
      browserless:
        condition: service_healthy

  browserless:
    image: ghcr.io/browserless/chromium
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - CONCURRENT=3
      - CONNECTION_TIMEOUT=600000
      - TIMEOUT=600000
      - HEALTH=true
      - MAX_MEMORY_PERCENT=80
      - MAX_CPU_PERCENT=85
      - CHROME_FLAGS=--disable-dev-shm-usage --disable-gpu --disable-extensions --disable-background-networking --no-zygote --disable-background-timer-throttling --disable-renderer-backgrounding
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/json/version"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  coolify:
    external: true

volumes:
  reports:
