# docker-compose.coolify.yml — Coolify deployment (v3 architecture)
# 3 services: API server, Worker, Browserless (Chromium pool)
# Coolify's Traefik handles SSL + domain routing + basic auth.
# Reuses PostgreSQL from ai-news-platform via shared coolify network.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - coolify
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - PORT=3000
      - REPORTS_DIR=/app/reports
    volumes:
      - reports:/app/reports
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.a11y-https.rule=Host(`a11y.pguerrero.me`)"
      - "traefik.http.routers.a11y-https.entrypoints=https"
      - "traefik.http.routers.a11y-https.tls=true"
      - "traefik.http.routers.a11y-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.a11y-http.rule=Host(`a11y.pguerrero.me`)"
      - "traefik.http.routers.a11y-http.entrypoints=http"
      - "traefik.http.routers.a11y-http.middlewares=a11y-redirect"
      - "traefik.http.middlewares.a11y-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.a11y-https.middlewares=a11y-auth"
      - "traefik.http.middlewares.a11y-auth.basicauth.users=ally-news:${BASIC_AUTH_USERS}"
      - "traefik.http.services.a11y.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_API_BASE_URL=${LLM_API_BASE_URL:-https://api.moonshot.ai/v1}
      - BROWSERLESS_URL=ws://browserless:3000/chromium/playwright
      - REPORTS_DIR=/app/reports
      - NODE_ENV=production
    volumes:
      - reports:/app/reports
    depends_on:
      browserless:
        condition: service_healthy

  browserless:
    image: ghcr.io/browserless/chromium
    restart: unless-stopped
    networks:
      - coolify
    environment:
      - MAX_CONCURRENT_SESSIONS=2
      - CONNECTION_TIMEOUT=120000
      - TIMEOUT=120000
      - HEALTH=true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/json/version"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  coolify:
    external: true

volumes:
  reports:
